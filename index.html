<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fff3d6">
    <title>Maths Notebook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #2f2b6b;
            --soft: #6b6a94;
            --card: #ffffff;
            --coral: #ff7a59;
            --sun: #ffd23f;
            --mint: #3ddc97;
            --sky: #4cc9f0;
            --pink: #ff8fb8;
            --violet: #9b8cff;
            --good: #1fae6b;
            --bad: #ef476f;
            --font: 'Fredoka', 'Nunito', 'Trebuchet MS', system-ui, sans-serif;
            --radius: 22px;
            --shadow: 0 6px 0 rgba(47, 43, 107, .14), 0 12px 24px rgba(47, 43, 107, .10);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            font-family: var(--font);
            color: var(--ink);
            font-size: clamp(16px, 1.1vw + 13px, 20px);
            background:
                radial-gradient(circle at 10% 10%, #ffe9a8 0, transparent 40%),
                radial-gradient(circle at 90% 20%, #c9f0ff 0, transparent 42%),
                radial-gradient(circle at 20% 90%, #ffd9e8 0, transparent 40%),
                radial-gradient(circle at 90% 90%, #d9fbe7 0, transparent 40%),
                #fff8e8;
            background-attachment: fixed;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            overflow-x: hidden;
        }

        /* floating decorations */
        .deco {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .deco span {
            position: absolute;
            font-weight: 700;
            opacity: .16;
            animation: float 9s ease-in-out infinite;
        }

        .deco span:nth-child(1) {
            left: 6%;
            top: 12%;
            font-size: 3.2rem;
            color: var(--coral);
        }

        .deco span:nth-child(2) {
            right: 8%;
            top: 18%;
            font-size: 2.6rem;
            color: var(--sky);
            animation-delay: -2s;
        }

        .deco span:nth-child(3) {
            left: 12%;
            bottom: 14%;
            font-size: 3rem;
            color: var(--mint);
            animation-delay: -4s;
        }

        .deco span:nth-child(4) {
            right: 10%;
            bottom: 10%;
            font-size: 3.4rem;
            color: var(--violet);
            animation-delay: -6s;
        }

        .deco span:nth-child(5) {
            left: 48%;
            top: 6%;
            font-size: 2.2rem;
            color: var(--pink);
            animation-delay: -3s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(-6deg);
            }

            50% {
                transform: translateY(-18px) rotate(6deg);
            }
        }

        .app {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 980px;
            margin: 0 auto;
            padding: clamp(14px, 3vw, 32px);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }

        h1,
        h2 {
            margin: 0;
            line-height: 1.1;
        }

        /* ---------- Header ---------- */
        .hero {
            text-align: center;
            margin: 6px 0 22px;
        }

        .hero h1 {
            font-size: clamp(2.2rem, 7vw, 3.6rem);
            font-weight: 700;
            letter-spacing: .5px;
        }

        .hero h1 .c1 {
            color: var(--coral);
        }

        .hero h1 .c2 {
            color: #f5a300;
        }

        .hero h1 .c3 {
            color: var(--good);
        }

        .hero h1 .c4 {
            color: #2aa9d6;
        }

        .hero h1 .c5 {
            color: var(--violet);
        }

        .sub {
            margin: 8px 0 0;
            color: var(--soft);
            font-size: 1.05rem;
        }

        /* ---------- Cards / Buttons ---------- */
        .card {
            background: var(--card);
            border-radius: var(--radius);
            border: 3px solid var(--ink);
            box-shadow: var(--shadow);
        }

        button {
            font-family: var(--font);
            color: var(--ink);
            cursor: pointer;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px 18px;
            margin-top: 12px;
            font-size: 1.2rem;
            font-weight: 600;
            text-align: center;
            background: #fff;
            border: 3px solid var(--ink);
            border-radius: 18px;
            box-shadow: 0 5px 0 var(--ink);
            transition: transform .1s, box-shadow .1s, filter .15s;
        }

        .btn:hover {
            filter: brightness(1.04);
        }

        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 var(--ink);
        }

        .btn.primary {
            background: var(--sun);
        }

        .btn.green {
            background: var(--mint);
        }

        .btn.sky {
            background: #bdeeff;
        }

        /* ---------- Home categories ---------- */
        .cats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: clamp(14px, 2.4vw, 24px);
        }

        .cat {
            --c: var(--sun);
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            text-align: left;
            padding: 20px 18px 18px;
            background: var(--c);
            border: 3px solid var(--ink);
            border-radius: 26px;
            box-shadow: 0 7px 0 var(--ink);
            transition: transform .12s, box-shadow .12s;
            overflow: hidden;
        }

        .cat::after {
            content: "";
            position: absolute;
            right: -30px;
            top: -30px;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .35);
        }

        .cat:hover {
            transform: translateY(-4px);
            box-shadow: 0 11px 0 var(--ink);
        }

        .cat:active {
            transform: translateY(6px);
            box-shadow: 0 1px 0 var(--ink);
        }

        .cat .ico {
            display: grid;
            place-items: center;
            width: 58px;
            height: 58px;
            border-radius: 18px;
            background: #fff;
            border: 3px solid var(--ink);
            font-size: 1.7rem;
            font-weight: 700;
        }

        .cat .name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 6px;
            position: relative;
            z-index: 1;
        }

        .cat small {
            font-size: .98rem;
            color: #3d3a78;
            position: relative;
            z-index: 1;
        }

        .cat.c-tables {
            --c: #ffd96b;
        }

        .cat.c-two {
            --c: #8fdcff;
        }

        .cat.c-three {
            --c: #ffb3cf;
        }

        .best {
            margin: 22px 0 0;
            text-align: center;
            color: var(--soft);
            font-size: 1rem;
        }

        /* ---------- Sub screen ---------- */
        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fade .3s ease;
        }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 1.05rem;
            font-weight: 600;
            background: #fff;
            border: 3px solid var(--ink);
            border-radius: 999px;
            box-shadow: 0 4px 0 var(--ink);
        }

        .back:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .sub-wrap {
            --c: var(--sun);
            max-width: 720px;
            margin: 0 auto;
        }

        .sub-head {
            margin: 18px 0 6px;
            padding: 16px 18px;
            background: var(--c);
            border: 3px solid var(--ink);
            border-radius: 22px;
            box-shadow: 0 5px 0 var(--ink);
        }

        .sub-head h2 {
            font-size: clamp(1.6rem, 5vw, 2.2rem);
        }

        .sub-head .sub {
            color: #3d3a78;
            margin-top: 6px;
        }

        .chips {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
            margin: 18px 0;
        }

        .chip {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            min-height: 78px;
            padding: 10px 12px;
            font-size: 1.2rem;
            font-weight: 600;
            text-align: center;
            background: #fff;
            border: 3px solid var(--ink);
            border-radius: 20px;
            box-shadow: 0 5px 0 var(--ink);
            transition: transform .1s, box-shadow .1s, background .15s;
        }

        .chip:nth-child(5n+1) {
            background: #ffe9a3;
        }

        .chip:nth-child(5n+2) {
            background: #c4f3dd;
        }

        .chip:nth-child(5n+3) {
            background: #cfeeff;
        }

        .chip:nth-child(5n+4) {
            background: #ffd6e6;
        }

        .chip:nth-child(5n+5) {
            background: #e3dcff;
        }

        .chip:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 0 var(--ink);
        }

        .chip:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 var(--ink);
        }

        .chip small {
            font-size: .85rem;
            font-weight: 500;
            color: #4a4880;
        }

        .setting {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            padding: 12px 16px;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .setting select {
            font-family: var(--font);
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--ink);
            padding: 6px 14px;
            background: #fff4c7;
            border: 3px solid var(--ink);
            border-radius: 14px;
            outline: none;
        }

        /* ---------- Game ---------- */
        .game-wrap {
            max-width: 600px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 1.05rem;
            font-weight: 500;
        }

        .pill {
            padding: 4px 14px;
            white-space: nowrap;
            background: #fff;
            border: 3px solid var(--ink);
            border-radius: 999px;
            font-weight: 600;
        }

        .pill.mode {
            background: #e3dcff;
        }

        .pill.time {
            background: #cfeeff;
        }

        .pill.star {
            background: #fff0b0;
        }

        .pill.fire {
            background: #ffd9cc;
        }

        .pill.qn {
            background: #c4f3dd;
        }

        .progress {
            height: 20px;
            margin: 12px 0;
            overflow: hidden;
            background: #fff;
            border: 3px solid var(--ink);
            border-radius: 999px;
            padding: 0;
        }

        .progress i {
            display: block;
            height: 100%;
            width: 0;
            border-radius: 999px;
            background: repeating-linear-gradient(45deg, var(--mint), var(--mint) 10px, #6ef0b8 10px, #6ef0b8 20px);
            transition: width .35s;
        }

        .play {
            margin-top: 14px;
            padding: clamp(16px, 4vw, 28px) clamp(12px, 3vw, 24px);
            background: #fff;
        }

        .question {
            font-size: clamp(2.4rem, 11vw, 4.4rem);
            font-weight: 700;
            text-align: center;
            margin: 6px 0 16px;
            color: var(--ink);
            word-break: break-word;
        }

        .question .x {
            color: var(--coral);
            margin: 0 8px;
        }

        .answer-row {
            display: flex;
            justify-content: center;
        }

        #answer {
            width: min(78%, 340px);
            font-family: var(--font);
            font-size: clamp(1.8rem, 7vw, 2.6rem);
            font-weight: 600;
            text-align: center;
            padding: 8px 10px;
            background: #fff9d6;
            color: var(--ink);
            border: 3px solid var(--ink);
            border-radius: 18px;
            outline: none;
            transition: box-shadow .15s, background .15s;
        }

        #answer:focus {
            background: #fff4b8;
            box-shadow: 0 0 0 5px rgba(76, 201, 240, .5);
        }

        #answer:disabled {
            opacity: 1;
            -webkit-text-fill-color: var(--ink);
        }

        .feedback {
            min-height: 84px;
            text-align: center;
            font-size: 1.3rem;
            margin: 14px 0 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .feedback .good {
            color: var(--good);
            font-weight: 700;
            font-size: 2rem;
        }

        .feedback .bad {
            color: var(--bad);
            font-weight: 700;
            font-size: 1.8rem;
        }

        .shake {
            animation: shake .35s;
        }

        @keyframes shake {
            25% {
                transform: translateX(-8px);
            }

            75% {
                transform: translateX(8px);
            }
        }

        .pop {
            animation: pop .4s;
        }

        @keyframes pop {
            50% {
                transform: scale(1.15);
            }
        }

        /* ---------- Per-question timer + action buttons ---------- */
        .qtimer {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0 0 14px;
        }

        .qtimer[hidden] {
            display: none;
        }

        .qt-track {
            flex: 1;
            height: 16px;
            overflow: hidden;
            background: #eef6ff;
            border: 3px solid var(--ink);
            border-radius: 999px;
        }

        .qt-track i {
            display: block;
            height: 100%;
            width: 100%;
            background: var(--mint);
            border-radius: 999px;
        }

        .qt-num {
            min-width: 64px;
            padding: 2px 10px;
            text-align: center;
            font-weight: 700;
            white-space: nowrap;
            background: #cfeeff;
            border: 3px solid var(--ink);
            border-radius: 999px;
        }

        .qtimer.warn .qt-track i {
            background: var(--sun);
        }

        .qtimer.warn .qt-num {
            background: #fff0b0;
        }

        .qtimer.danger .qt-track i {
            background: var(--coral);
        }

        .qtimer.danger .qt-num {
            background: #ffd9cc;
            animation: pulse .6s ease-in-out infinite;
        }

        @keyframes pulse {
            50% {
                transform: scale(1.1);
            }
        }

        .actions {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 12px;
        }

        .btn:disabled,
        .btn:disabled:active {
            opacity: .45;
            cursor: not-allowed;
            filter: none;
            transform: none;
            box-shadow: 0 5px 0 var(--ink);
        }

        .setting+.setting {
            margin-top: 14px;
        }

        .setting .tgroup {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .setting input[type="text"] {
            width: 84px;
            font-family: var(--font);
            font-size: 1.1rem;
            font-weight: 600;
            text-align: center;
            color: var(--ink);
            padding: 6px 10px;
            background: #fff4c7;
            border: 3px solid var(--ink);
            border-radius: 14px;
            outline: none;
        }

        .setting .hint-err {
            flex-basis: 100%;
            color: var(--bad);
            font-size: .95rem;
            font-weight: 500;
        }

        .review .sk {
            color: #a8650a;
            font-weight: 500;
        }

        /* ---------- Result ---------- */
        .result-wrap {
            max-width: 600px;
            margin: 0 auto;
        }

        .result-top {
            padding: 20px 16px;
            text-align: center;
            background: linear-gradient(135deg, #fff2b8, #ffd9e8 55%, #d4f1ff);
        }

        .result-top h2 {
            font-size: clamp(1.8rem, 6vw, 2.4rem);
        }

        .score-big {
            font-size: clamp(3.4rem, 16vw, 5.4rem);
            font-weight: 700;
            margin: 6px 0 0;
            color: var(--ink);
        }

        .stars {
            font-size: clamp(2rem, 9vw, 2.8rem);
            letter-spacing: 6px;
        }

        .msg {
            font-size: 1.3rem;
            font-weight: 500;
            margin: 6px 0 8px;
        }

        .result-top .best {
            margin: 6px 0 0;
        }

        .review {
            margin: 16px 0 4px;
            padding: 10px 16px;
            font-size: 1.05rem;
            max-height: 320px;
            overflow-y: auto;
        }

        .review div {
            border-bottom: 2px dashed #d5d3ee;
            padding: 6px 0;
        }

        .review div:last-child {
            border-bottom: none;
        }

        .review .ok {
            color: var(--good);
            font-weight: 500;
        }

        .review .no {
            color: var(--bad);
            font-weight: 500;
        }

        /* ---------- Footer ---------- */
        .footer {
            margin-top: 30px;
            text-align: center;
            font-weight: 600;
            font-size: 1.15rem;
        }

        .footer span {
            display: inline-block;
            padding: 6px 20px;
            background: var(--sun);
            border: 3px solid var(--ink);
            border-radius: 999px;
            box-shadow: 0 4px 0 var(--ink);
        }

        .footer small {
            display: block;
            font-weight: 400;
            font-size: .95rem;
            color: var(--soft);
            margin-top: 10px;
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 480px) {
            .topbar {
                font-size: .95rem;
            }

            .chips {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .chip {
                font-size: 1.05rem;
                min-height: 70px;
            }

            .cat {
                padding: 16px 14px;
            }

            .cat .name {
                font-size: 1.3rem;
            }

            .deco span {
                opacity: .1;
            }
        }

        @media (max-width: 340px) {
            .chips {
                grid-template-columns: 1fr;
            }
        }

        @media (min-width: 900px) {
            .cats {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <div class="deco" aria-hidden="true">
        <span>+</span><span>×</span><span>÷</span><span>=</span><span>7</span>
    </div>

    <div class="app">
        <main>
            <!-- ===== HOME ===== -->
            <section id="home" class="screen active">
                <div class="hero">
                    <h1><span class="c1">Maths</span> <span class="c2">Note</span><span class="c3">book</span> ✏️</h1>
                    <p class="sub">Pick a page &amp; practise! 🚀</p>
                </div>

                <div class="cats">
                    <button class="cat c-tables" onclick="openCat('tables')">
                        <span class="ico">✖</span>
                        <span class="name">Tables</span>
                        <small>2–10, 10–20, 20–30, 30–40, 40–50</small>
                    </button>
                    <button class="cat c-two" onclick="openCat('two')">
                        <span class="ico">2D</span>
                        <span class="name">Two Digit Multiplication</span>
                        <small>2 × 1 digit, 2 × 2 digits</small>
                    </button>
                    <button class="cat c-three" onclick="openCat('three')">
                        <span class="ico">3D</span>
                        <span class="name">Three Digit Multiplication</span>
                        <small>3 × 1, 3 × 2, 3 × 3 digits</small>
                    </button>
                </div>

                <p class="best" id="totalStats"></p>
            </section>

            <!-- ===== SUB CATEGORY ===== -->
            <section id="sub" class="screen">
                <div class="sub-wrap" id="subWrap">
                    <button class="back" onclick="show('home')">← Back</button>
                    <div class="sub-head">
                        <h2 id="subTitle"></h2>
                        <p class="sub" id="subHint"></p>
                    </div>
                    <div class="chips" id="chips"></div>
                    <div class="card setting">
                        <label for="qcount">Questions per round:</label>
                        <select id="qcount">
                            <option>5</option>
                            <option selected>10</option>
                            <option>15</option>
                            <option>20</option>
                        </select>
                    </div>
                    <div class="card setting">
                        <label for="qtime">⏳ Time per question:</label>
                        <div class="tgroup">
                            <select id="qtime">
                                <option value="0" selected>No limit</option>
                                <option value="5">5 seconds</option>
                                <option value="10">10 seconds</option>
                                <option value="15">15 seconds</option>
                                <option value="20">20 seconds</option>
                                <option value="30">30 seconds</option>
                                <option value="45">45 seconds</option>
                                <option value="60">60 seconds</option>
                                <option value="custom">Custom…</option>
                            </select>
                            <input id="qtimeCustom" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3"
                                placeholder="sec" autocomplete="off" aria-label="Custom seconds per question" hidden>
                        </div>
                        <div class="hint-err" id="qtimeErr" role="alert" hidden></div>
                    </div>
                </div>
            </section>

            <!-- ===== GAME ===== -->
            <section id="game" class="screen">
                <div class="game-wrap">
                    <div class="topbar">
                        <button class="back" onclick="quit()">✕ Quit</button>
                        <span class="pill mode" id="modeName"></span>
                        <span class="pill time">⏱ <span id="timer">0</span>s</span>
                    </div>
                    <div class="progress"><i id="bar"></i></div>
                    <div class="topbar">
                        <span class="pill qn">Q <b id="qNo">1</b>/<span id="qTotal">10</span></span>
                        <span class="pill star">⭐ <b id="score">0</b></span>
                        <span class="pill fire">🔥 <b id="streak">0</b></span>
                    </div>

                    <div class="card play">
                        <div class="qtimer" id="qtimer" hidden>
                            <div class="qt-track"><i id="qtBar"></i></div>
                            <span class="qt-num" id="qtNum">0s</span>
                        </div>
                        <div class="question" id="question"></div>
                        <div class="answer-row">
                            <input id="answer" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off"
                                placeholder="?">
                        </div>
                        <div class="feedback" id="feedback"></div>
                        <div class="actions">
                            <button class="btn primary" id="mainBtn">Check ✔</button>
                            <button class="btn sky" id="skipBtn" title="Skip this question">Skip ⏭</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- ===== RESULT ===== -->
            <section id="result" class="screen">
                <div class="result-wrap">
                    <div class="card result-top">
                        <h2>Page done! 📖</h2>
                        <div class="score-big"><span id="rScore">0</span>/<span id="rTotal">0</span></div>
                        <div class="stars" id="rStars"></div>
                        <div class="msg" id="rMsg"></div>
                        <p class="best" id="rBest"></p>
                    </div>
                    <div class="card review" id="rReview"></div>
                    <button class="btn primary" onclick="startGame(currentMode)">Try again 🔁</button>
                    <button class="btn sky" onclick="show('sub')">Choose another page</button>
                    <button class="btn green" onclick="show('home')">Home 🏠</button>
                </div>
            </section>
        </main>

        <footer class="footer">
            <span>✏️ Made by @the.akanova</span>
            <small>Practise daily, become a maths star ⭐</small>
        </footer>
    </div>

    <script>
        /* ===================== DATA ===================== */
        const CATS = {
            tables: {
                title: 'Tables',
                color: '#ffd96b',
                hint: 'Pick a range. You get questions like 17 × 6.',
                modes: [
                    { id: 't2', label: '2 – 10', lo: 2, hi: 10 },
                    { id: 't10', label: '10 – 20', lo: 10, hi: 20 },
                    { id: 't20', label: '20 – 30', lo: 20, hi: 30 },
                    { id: 't30', label: '30 – 40', lo: 30, hi: 40 },
                    { id: 't40', label: '40 – 50', lo: 40, hi: 50 }
                ],
                make(m) { // table number x 1..10
                    const a = rnd(m.lo, m.hi), b = rnd(1, 10);
                    return [a, b];
                }
            },
            two: {
                title: 'Two Digit Multiplication',
                color: '#8fdcff',
                hint: 'Numbers from 10 to 99.',
                modes: [
                    { id: 'd21', label: '2 digit × 1 digit', a: [10, 99], b: [2, 9] },
                    { id: 'd22', label: '2 digit × 2 digits', a: [10, 99], b: [10, 99] }
                ],
                make(m) { return [rnd(...m.a), rnd(...m.b)]; }
            },
            three: {
                title: 'Three Digit Multiplication',
                color: '#ffb3cf',
                hint: 'Numbers from 100 to 999. Use your notebook for rough work!',
                modes: [
                    { id: 'd31', label: '3 digit × 1 digit', a: [100, 999], b: [2, 9] },
                    { id: 'd32', label: '3 digit × 2 digits', a: [100, 999], b: [10, 99] },
                    { id: 'd33', label: '3 digit × 3 digits', a: [100, 999], b: [100, 999] }
                ],
                make(m) { return [rnd(...m.a), rnd(...m.b)]; }
            }
        };

        /* ===================== STATE ===================== */
        let currentCat = null, currentMode = null;
        let qs = [], idx = 0, score = 0, streak = 0, answered = false;
        let timerId = null, secs = 0;
        let qTimerId = null, qDeadline = 0, qLimit = 0, autoId = null; // per-question timer

        const $ = id => document.getElementById(id);
        function rnd(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
        function show(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            $(id).classList.add('active');
            if (id === 'home') updateTotals();
            window.scrollTo(0, 0);
        }

        /* ===================== STORAGE ===================== */
        function load() { try { return JSON.parse(localStorage.getItem('mathsNotebook')) || {} } catch (e) { return {} } }
        function save(d) { try { localStorage.setItem('mathsNotebook', JSON.stringify(d)) } catch (e) { } }
        function updateTotals() {
            const d = load(); const played = Object.values(d).reduce((s, x) => s + (x.plays || 0), 0);
            $('totalStats').textContent = played ? `Rounds played: ${played} 📝` : 'Tip: a little practice every day makes you fast! 🚀';
        }

        /* ===================== SETTINGS ===================== */
        const SKEY = 'mathsNotebookSettings'; // separate key so best-score data is untouched
        function loadSettings() { try { return JSON.parse(localStorage.getItem(SKEY)) || {} } catch (e) { return {} } }
        function saveSettings() {
            try { localStorage.setItem(SKEY, JSON.stringify({ count: $('qcount').value, time: $('qtime').value, custom: $('qtimeCustom').value })) } catch (e) { }
        }
        function hasOption(sel, v) { return [...sel.options].some(o => o.value === String(v)); }
        function syncTimeUI() { $('qtimeCustom').hidden = $('qtime').value !== 'custom'; }
        function showTimeErr(msg) {
            const el = $('qtimeErr'); el.textContent = msg; el.hidden = !msg;
            const t = $('qtimeCustom');
            if (msg && !t.hidden) { t.classList.add('shake'); setTimeout(() => t.classList.remove('shake'), 400); t.focus(); }
        }
        // seconds per question: 0 = no limit, NaN = invalid custom value
        function getLimit() {
            const v = $('qtime').value;
            if (v !== 'custom') return +v;
            const n = parseInt($('qtimeCustom').value, 10);
            return (n >= 1 && n <= 300) ? n : NaN;
        }
        function applySettings() {
            const s = loadSettings();
            if (s.count && hasOption($('qcount'), s.count)) $('qcount').value = String(s.count);
            if (s.time && hasOption($('qtime'), s.time)) $('qtime').value = String(s.time);
            if (typeof s.custom === 'string') $('qtimeCustom').value = s.custom.replace(/\D/g, '').slice(0, 3);
            syncTimeUI();
        }

        /* ===================== MENU ===================== */
        function openCat(key) {
            currentCat = key;
            const c = CATS[key], d = load();
            $('subTitle').textContent = c.title;
            $('subHint').textContent = c.hint;
            $('subWrap').style.setProperty('--c', c.color);
            const box = $('chips'); box.innerHTML = '';
            c.modes.forEach(m => {
                const b = document.createElement('button');
                b.className = 'chip';
                const best = d[m.id] && d[m.id].best != null ? `<small>best ${d[m.id].best}/${d[m.id].bestTotal || Math.max(10, d[m.id].best)}</small>` : '';
                b.innerHTML = m.label + best;
                b.onclick = () => startGame(m);
                box.appendChild(b);
            });
            show('sub');
        }

        /* ===================== GAME ===================== */
        function startGame(mode) {
            const limit = getLimit();
            if (Number.isNaN(limit)) { showTimeErr('Please enter seconds from 1 to 300'); return; }
            showTimeErr('');
            saveSettings();
            currentMode = mode;
            qLimit = limit;
            const cat = CATS[currentCat];
            const n = +$('qcount').value;
            qs = []; const seen = new Set();
            let guard = 0;
            while (qs.length < n && guard++ < 500) {
                const [a, b] = cat.make(mode);
                const key = a + 'x' + b;
                if (seen.has(key)) continue;
                seen.add(key); qs.push({ a, b, ans: a * b, given: null, ok: false, status: null });
            }
            idx = 0; score = 0; streak = 0; secs = 0;
            stopQTimer(); stopAuto();
            $('modeName').textContent = mode.label;
            $('qTotal').textContent = qs.length;
            clearInterval(timerId);
            $('timer').textContent = 0;
            timerId = setInterval(() => { secs++; $('timer').textContent = secs; }, 1000);
            show('game');
            showQuestion();
        }

        function showQuestion() {
            const q = qs[idx]; answered = false;
            $('question').innerHTML = `${q.a}<span class="x">×</span>${q.b}`;
            $('answer').value = ''; $('answer').disabled = false;
            $('feedback').innerHTML = '';
            $('mainBtn').textContent = 'Check ✔';
            $('qNo').textContent = idx + 1;
            $('score').textContent = score;
            $('streak').textContent = streak;
            $('bar').style.width = (idx / qs.length * 100) + '%';
            $('skipBtn').disabled = false;
            setTimeout(() => { if (!answered && $('game').classList.contains('active')) $('answer').focus(); }, 50);
            startQTimer();
        }

        function check() {
            if (answered) { next(); return; }
            const v = $('answer').value.trim();
            if (v === '') { $('answer').classList.add('shake'); setTimeout(() => $('answer').classList.remove('shake'), 400); return; }
            stopQTimer(); // answered in time: stop the countdown
            const q = qs[idx]; q.given = +v; answered = true;
            lockInput();
            if (q.given === q.ans) {
                q.ok = true; q.status = 'ok'; score++; streak++;
                const praise = ['Super! 🌟', 'Correct! ✅', 'Wow! 🎉', 'Brilliant! 💡', 'Yes! 👏'][rnd(0, 4)];
                $('feedback').innerHTML = `<div class="good pop">${praise}</div>` + (streak >= 3 ? `<div>🔥 ${streak} in a row!</div>` : '');
            } else {
                streak = 0; q.status = 'wrong';
                $('feedback').innerHTML = `<div class="bad shake">Oops! ❌</div><div>${q.a} × ${q.b} = <b>${q.ans}</b></div>`;
            }
            $('score').textContent = score; $('streak').textContent = streak;
            $('bar').style.width = ((idx + 1) / qs.length * 100) + '%';
            $('mainBtn').textContent = idx === qs.length - 1 ? 'Finish 🏁' : 'Next →';
        }

        /* ---------- per-question timer ---------- */
        const AUTO_MS = 1800; // "time's up" answer stays on screen this long, then it moves on by itself

        function stopQTimer() { clearInterval(qTimerId); qTimerId = null; }
        function stopAuto() { clearTimeout(autoId); autoId = null; }

        // disable input + skip once a question is settled; keep keyboard focus on the main button
        function lockInput() {
            $('answer').disabled = true;
            $('mainBtn').focus();
            $('skipBtn').disabled = true;
        }

        function paintQTimer(leftMs) {
            const frac = Math.max(0, Math.min(1, leftMs / (qLimit * 1000)));
            const danger = frac <= .3 || (leftMs <= 3000 && frac <= .6);
            $('qtBar').style.width = (frac * 100) + '%';
            $('qtNum').textContent = Math.ceil(Math.max(0, leftMs) / 1000) + 's';
            $('qtimer').classList.toggle('danger', danger);
            $('qtimer').classList.toggle('warn', !danger && frac <= .6);
        }

        function startQTimer() {
            stopQTimer();
            if (!qLimit) { $('qtimer').hidden = true; return; }
            $('qtimer').hidden = false;
            qDeadline = Date.now() + qLimit * 1000; // timestamp based, so it never drifts
            paintQTimer(qLimit * 1000);
            qTimerId = setInterval(() => {
                if (answered) { stopQTimer(); return; }
                const left = qDeadline - Date.now();
                if (left <= 0) timeUp(); else paintQTimer(left);
            }, 100);
        }

        function timeUp() {
            if (answered) return;
            stopQTimer();
            const q = qs[idx]; q.status = 'timeout'; q.given = null;
            answered = true; streak = 0;
            lockInput();
            paintQTimer(0);
            $('feedback').innerHTML = `<div class="bad pop">Time's up! ⏰</div><div>${q.a} × ${q.b} = <b>${q.ans}</b></div>`;
            $('score').textContent = score; $('streak').textContent = streak;
            $('bar').style.width = ((idx + 1) / qs.length * 100) + '%';
            $('mainBtn').textContent = idx === qs.length - 1 ? 'Finish 🏁' : 'Next →';
            stopAuto();
            const at = idx;
            autoId = setTimeout(() => {
                autoId = null;
                if (answered && idx === at && $('game').classList.contains('active')) next();
            }, AUTO_MS);
        }

        function skipQ() {
            if (answered || !$('game').classList.contains('active')) return;
            stopQTimer(); stopAuto();
            const q = qs[idx]; q.status = 'skip'; q.given = null;
            streak = 0;
            next();
        }

        function next() {
            stopQTimer(); stopAuto();
            idx++;
            if (idx >= qs.length) finish(); else showQuestion();
        }

        function quit() {
            clearInterval(timerId);
            stopQTimer(); stopAuto();
            show('sub');
        }

        function finish() {
            clearInterval(timerId);
            stopQTimer(); stopAuto();
            const total = qs.length, pct = score / total;
            $('rScore').textContent = score; $('rTotal').textContent = total;
            const st = pct >= .9 ? 3 : pct >= .6 ? 2 : pct >= .3 ? 1 : 0;
            $('rStars').textContent = '⭐'.repeat(st) + '☆'.repeat(3 - st);
            $('rMsg').textContent = pct === 1 ? 'Perfect! You are a maths wizard! 🧙' :
                pct >= .8 ? 'Excellent work! 🎉' :
                    pct >= .5 ? 'Good job, keep going! 💪' : 'Keep practising, you will get it! 🌱';
            // save best (by score%, then time)
            const d = load(), m = d[currentMode.id] || { plays: 0, best: null, bestTime: null, bestTotal: null };
            m.plays++;
            let note = `Time: ${secs}s`;
            // compare by percentage (rounds can have 5/10/15/20 questions); old saves had no bestTotal
            const oldTotal = m.bestTotal || Math.max(10, m.best || 0);
            const oldPct = m.best === null ? -1 : m.best / oldTotal;
            if (m.best === null || pct > oldPct || (pct === oldPct && total === oldTotal && secs < m.bestTime)) {
                const was = m.best; m.best = score; m.bestTotal = total; m.bestTime = secs;
                if (was !== null) note += ' · 🏆 New best!';
            } else note += ` · Best: ${m.best}/${oldTotal}`;
            d[currentMode.id] = m; save(d);
            const skipped = qs.filter(q => q.status === 'skip' || q.status === 'timeout').length;
            if (skipped) note += ` · Skipped: ${skipped}`;
            $('rBest').textContent = note;
            $('rReview').innerHTML = qs.map(q => {
                const eq = `${q.a} × ${q.b} = ${q.ans}`;
                if (q.status === 'ok') return `<div class="ok">✔ ${eq}</div>`;
                if (q.status === 'skip') return `<div class="sk">⏭ ${eq} <span style="color:var(--soft)">(skipped)</span></div>`;
                if (q.status === 'timeout') return `<div class="sk">⏰ ${eq} <span style="color:var(--soft)">(time up)</span></div>`;
                return `<div class="no">✘ ${eq} <span style="color:var(--soft)">(you: ${q.given})</span></div>`;
            }).join('');
            show('result');
        }

        /* ===================== EVENTS ===================== */
        $('mainBtn').addEventListener('click', check);
        $('skipBtn').addEventListener('click', skipQ);
        $('qcount').addEventListener('change', saveSettings);
        $('qtime').addEventListener('change', () => {
            syncTimeUI(); showTimeErr(''); saveSettings();
            if ($('qtime').value === 'custom') $('qtimeCustom').focus();
        });
        $('qtimeCustom').addEventListener('input', e => {
            e.target.value = e.target.value.replace(/\D/g, '').slice(0, 3);
            showTimeErr(''); saveSettings();
        });
        $('answer').addEventListener('keydown', e => {
            if (e.key !== 'Enter') return;
            e.preventDefault();
            e.stopPropagation(); // don't let this Enter bubble to the document handler (it would call check() a 2nd time and skip the question)
            if (!e.repeat) check(); // holding Enter must not rush through questions
        });
        $('answer').addEventListener('input', e => { e.target.value = e.target.value.replace(/[^0-9]/g, ''); });
        document.addEventListener('keydown', e => { // Enter on "Next" even when input disabled
            if (e.target.tagName === 'BUTTON' || e.repeat) return; // button's own click already handles Enter
            if (e.key === 'Enter' && answered && $('game').classList.contains('active')) check();
        });
        applySettings();
        updateTotals();
    </script>
</body>

</html>
