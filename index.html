<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#fdf6e3">
    <title>Maths Notebook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --paper: #fdf9ee;
            --line: #bcd6ec;
            --margin: #e8837c;
            --ink: #2b3a67;
            --pencil: #4a4a4a;
            --good: #2f8f4e;
            --bad: #d6453d;
            --yellow: #ffe66d;
            --hand: 'Patrick Hand', 'Caveat', 'Comic Sans MS', cursive;
            --title: 'Caveat', 'Patrick Hand', 'Comic Sans MS', cursive;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            font-family: var(--hand);
            color: var(--ink);
            background: #e9e2cf;
            display: flex;
            justify-content: center;
            font-size: 20px;
        }

        /* ---------- Notebook page ---------- */
        .notebook {
            width: 100%;
            max-width: 560px;
            min-height: 100vh;
            background:
                linear-gradient(90deg, transparent 54px, var(--margin) 54px, var(--margin) 56px, transparent 56px),
                repeating-linear-gradient(transparent, transparent 31px, var(--line) 31px, var(--line) 32px),
                var(--paper);
            background-position: 0 0, 0 12px, 0 0;
            padding: 18px 18px 40px 74px;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 0, 0, .18);
        }

        /* spiral holes */
        .notebook::before {
            content: "";
            position: absolute;
            left: 12px;
            top: 0;
            bottom: 0;
            width: 22px;
            background: radial-gradient(circle at 11px 14px, #cfc7b0 0 7px, #8d866f 8px, transparent 9px) 0 0/22px 64px repeat-y;
            opacity: .85;
        }

        h1,
        h2,
        h3 {
            font-family: var(--title);
            margin: 0;
            font-weight: 700;
            line-height: 1.1
        }

        h1 {
            font-size: 2.6rem;
            transform: rotate(-2deg);
            display: inline-block;
            position: relative
        }

        h1::after {
            /* hand-drawn underline */
            content: "";
            position: absolute;
            left: 0;
            right: -6px;
            bottom: -4px;
            height: 8px;
            background: var(--yellow);
            z-index: -1;
            border-radius: 60% 40% 55% 45%/60% 50% 50% 40%;
            transform: rotate(1deg);
        }

        .sub {
            margin: 8px 0 14px;
            color: var(--pencil);
            font-size: 1rem
        }

        /* ---------- Sketchy buttons / cards ---------- */
        .sketch {
            border: 2.5px solid var(--pencil);
            border-radius: 255px 18px 225px 18px/18px 225px 18px 255px;
            background: #fffdf5;
            box-shadow: 3px 4px 0 rgba(60, 60, 60, .45);
        }

        button {
            font-family: var(--hand);
            font-size: 1.15rem;
            color: var(--ink);
            cursor: pointer;
        }

        .btn {
            padding: 8px 16px;
            margin: 4px 0;
            transition: transform .12s, box-shadow .12s;
        }

        .btn:active {
            transform: translate(3px, 4px);
            box-shadow: 0 0 0 rgba(0, 0, 0, 0)
        }

        .btn.primary {
            background: var(--yellow)
        }

        .btn.block {
            display: block;
            width: 100%;
            text-align: left
        }

        .btn small {
            display: block;
            color: var(--pencil);
            font-size: .85rem
        }

        .cat {
            display: block;
            width: 100%;
            text-align: left;
            padding: 10px 14px;
            margin: 12px 0;
            font-size: 1.3rem;
        }

        .cat:nth-child(odd) {
            transform: rotate(-.6deg)
        }

        .cat:nth-child(even) {
            transform: rotate(.5deg)
        }

        .cat small {
            display: block;
            color: var(--pencil);
            font-size: .9rem
        }

        .cat .ico {
            display: inline-block;
            width: 34px;
            font-family: var(--title);
            font-size: 1.6rem
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 14px 0
        }

        .chip {
            padding: 8px 14px;
            font-size: 1.2rem;
            min-width: 90px;
            text-align: center
        }

        .chip:nth-child(3n) {
            transform: rotate(1deg)
        }

        .chip:nth-child(3n+1) {
            transform: rotate(-1deg)
        }

        .back {
            background: none;
            border: none;
            font-size: 1.1rem;
            padding: 4px 0;
            text-decoration: underline wavy var(--margin);
        }

        .screen {
            display: none;
            animation: fade .25s ease
        }

        .screen.active {
            display: block
        }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(6px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        /* ---------- Game ---------- */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-size: 1.05rem
        }

        .pill {
            padding: 2px 12px;
            white-space: nowrap
        }

        .progress {
            height: 14px;
            margin: 10px 0 6px;
            overflow: hidden;
            background: #fff;
            padding: 0
        }

        .progress i {
            display: block;
            height: 100%;
            width: 0;
            background: repeating-linear-gradient(45deg, #7fb3e6, #7fb3e6 6px, #9cc7f0 6px, #9cc7f0 12px);
            transition: width .3s
        }

        .question {
            font-family: var(--title);
            font-size: 3.2rem;
            text-align: center;
            margin: 22px 0 10px;
            letter-spacing: 2px;
            color: var(--ink);
            word-break: break-word;
        }

        .question .x {
            color: var(--margin);
            margin: 0 6px
        }

        .answer-row {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center
        }

        #answer {
            width: 60%;
            font-family: var(--title);
            font-size: 2.4rem;
            text-align: center;
            padding: 4px 8px;
            background: #fffdf0;
            color: var(--ink);
            outline: none;
        }

        #answer:focus {
            background: #fff9c8
        }

        .feedback {
            min-height: 70px;
            text-align: center;
            font-size: 1.4rem;
            margin-top: 10px
        }

        .feedback .good {
            color: var(--good);
            font-family: var(--title);
            font-size: 2rem
        }

        .feedback .bad {
            color: var(--bad)
        }

        .shake {
            animation: shake .35s
        }

        @keyframes shake {
            25% {
                transform: translateX(-8px)
            }

            75% {
                transform: translateX(8px)
            }
        }

        .pop {
            animation: pop .4s
        }

        @keyframes pop {
            50% {
                transform: scale(1.15)
            }
        }

        /* ---------- Result ---------- */
        .score-big {
            font-family: var(--title);
            font-size: 4.5rem;
            text-align: center;
            margin: 10px 0 0;
            color: var(--ink)
        }

        .stars {
            text-align: center;
            font-size: 2.6rem;
            letter-spacing: 6px
        }

        .msg {
            text-align: center;
            font-size: 1.4rem;
            margin: 6px 0 14px
        }

        .review {
            margin: 10px 0;
            padding: 6px 12px;
            font-size: 1rem
        }

        .review div {
            border-bottom: 1px dashed #b9b29c;
            padding: 3px 0
        }

        .review .ok {
            color: var(--good)
        }

        .review .no {
            color: var(--bad)
        }

        .best {
            font-size: .95rem;
            color: var(--pencil);
            margin-top: 4px
        }

        /* ---------- Small / Big screens ---------- */
        @media (max-width:380px) {
            body {
                font-size: 18px
            }

            .notebook {
                padding-left: 64px
            }

            .question {
                font-size: 2.6rem
            }
        }

        @media (min-width:700px) {
            body {
                padding: 24px 0
            }

            .notebook {
                min-height: calc(100vh - 48px);
                border-radius: 6px
            }
        }
    </style>
</head>

<body>
    <div class="notebook">

        <!-- ===== HOME ===== -->
        <section id="home" class="screen active">
            <h1>Maths Notebook</h1>
            <p class="sub">Pick a page &amp; practise! ✏️</p>

            <button class="sketch cat" onclick="openCat('tables')">
                <span class="ico">✖</span>Tables
                <small>2–10, 10–20, 20–30, 30–40, 40–50</small>
            </button>
            <button class="sketch cat" onclick="openCat('two')">
                <span class="ico">2D</span>Two Digit Multiplication
                <small>2 × 1 digit, 2 × 2 digits</small>
            </button>
            <button class="sketch cat" onclick="openCat('three')">
                <span class="ico">3D</span>Three Digit Multiplication
                <small>3 × 1, 3 × 2, 3 × 3 digits</small>
            </button>

            <p class="best" id="totalStats"></p>
        </section>

        <!-- ===== SUB CATEGORY ===== -->
        <section id="sub" class="screen">
            <button class="back" onclick="show('home')">← back</button>
            <h2 id="subTitle" style="font-size:2.2rem;margin-top:6px"></h2>
            <p class="sub" id="subHint"></p>
            <div class="chips" id="chips"></div>
            <div class="sketch" style="padding:8px 14px;margin-top:8px">
                <label for="qcount">Questions per round: </label>
                <select id="qcount"
                    style="font-family:var(--hand);font-size:1.1rem;background:transparent;border:none;border-bottom:2px dashed var(--pencil)">
                    <option>5</option>
                    <option selected>10</option>
                    <option>15</option>
                    <option>20</option>
                </select>
            </div>
        </section>

        <!-- ===== GAME ===== -->
        <section id="game" class="screen">
            <div class="topbar">
                <button class="back" onclick="quit()">✕ quit</button>
                <span class="sketch pill" id="modeName"></span>
                <span class="sketch pill">⏱ <span id="timer">0</span>s</span>
            </div>
            <div class="progress sketch"><i id="bar"></i></div>
            <div class="topbar">
                <span>Q <b id="qNo">1</b>/<span id="qTotal">10</span></span>
                <span>⭐ <b id="score">0</b></span>
                <span>🔥 <b id="streak">0</b></span>
            </div>

            <div class="question" id="question"></div>
            <div class="answer-row">
                <input id="answer" class="sketch" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off"
                    placeholder="?">
            </div>
            <div class="feedback" id="feedback"></div>
            <button class="sketch btn primary block" id="mainBtn" style="text-align:center">Check ✔</button>
        </section>

        <!-- ===== RESULT ===== -->
        <section id="result" class="screen">
            <h2 style="font-size:2.2rem">Page done! 📖</h2>
            <div class="score-big"><span id="rScore">0</span>/<span id="rTotal">0</span></div>
            <div class="stars" id="rStars"></div>
            <div class="msg" id="rMsg"></div>
            <p class="best" id="rBest" style="text-align:center"></p>
            <div class="sketch review" id="rReview"></div>
            <button class="sketch btn primary block" style="text-align:center" onclick="startGame(currentMode)">Try
                again 🔁</button>
            <button class="sketch btn block" style="text-align:center" onclick="show('sub')">Choose another
                page</button>
            <button class="sketch btn block" style="text-align:center" onclick="show('home')">Home 🏠</button>
        </section>

    </div>

    <script>
        /* ===================== DATA ===================== */
        const CATS = {
            tables: {
                title: 'Tables',
                hint: 'Pick a range. You get questions like 17 × 6.',
                modes: [
                    { id: 't2', label: '2 – 10', lo: 2, hi: 10 },
                    { id: 't10', label: '10 – 20', lo: 10, hi: 20 },
                    { id: 't20', label: '20 – 30', lo: 20, hi: 30 },
                    { id: 't30', label: '30 – 40', lo: 30, hi: 40 },
                    { id: 't40', label: '40 – 50', lo: 40, hi: 50 }
                ],
                make(m) { // table number x 1..10
                    const a = rnd(m.lo, m.hi), b = rnd(1, 10);
                    return [a, b];
                }
            },
            two: {
                title: 'Two Digit Multiplication',
                hint: 'Numbers from 10 to 99.',
                modes: [
                    { id: 'd21', label: '2 digit × 1 digit', a: [10, 99], b: [2, 9] },
                    { id: 'd22', label: '2 digit × 2 digits', a: [10, 99], b: [10, 99] }
                ],
                make(m) { return [rnd(...m.a), rnd(...m.b)]; }
            },
            three: {
                title: 'Three Digit Multiplication',
                hint: 'Numbers from 100 to 999. Use your notebook for rough work!',
                modes: [
                    { id: 'd31', label: '3 digit × 1 digit', a: [100, 999], b: [2, 9] },
                    { id: 'd32', label: '3 digit × 2 digits', a: [100, 999], b: [10, 99] },
                    { id: 'd33', label: '3 digit × 3 digits', a: [100, 999], b: [100, 999] }
                ],
                make(m) { return [rnd(...m.a), rnd(...m.b)]; }
            }
        };

        /* ===================== STATE ===================== */
        let currentCat = null, currentMode = null;
        let qs = [], idx = 0, score = 0, streak = 0, answered = false;
        let timerId = null, secs = 0;

        const $ = id => document.getElementById(id);
        function rnd(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
        function show(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            $(id).classList.add('active');
            if (id === 'home') updateTotals();
            window.scrollTo(0, 0);
        }

        /* ===================== STORAGE ===================== */
        function load() { try { return JSON.parse(localStorage.getItem('mathsNotebook')) || {} } catch (e) { return {} } }
        function save(d) { try { localStorage.setItem('mathsNotebook', JSON.stringify(d)) } catch (e) { } }
        function updateTotals() {
            const d = load(); const played = Object.values(d).reduce((s, x) => s + (x.plays || 0), 0);
            $('totalStats').textContent = played ? `Rounds played: ${played} 📝` : 'Tip: a little practice every day makes you fast! 🚀';
        }

        /* ===================== MENU ===================== */
        function openCat(key) {
            currentCat = key;
            const c = CATS[key], d = load();
            $('subTitle').textContent = c.title;
            $('subHint').textContent = c.hint;
            const box = $('chips'); box.innerHTML = '';
            c.modes.forEach(m => {
                const b = document.createElement('button');
                b.className = 'sketch btn chip';
                const best = d[m.id] && d[m.id].best != null ? `<small>best ${d[m.id].best}</small>` : '';
                b.innerHTML = m.label + best;
                b.onclick = () => startGame(m);
                box.appendChild(b);
            });
            show('sub');
        }

        /* ===================== GAME ===================== */
        function startGame(mode) {
            currentMode = mode;
            const cat = CATS[currentCat];
            const n = +$('qcount').value;
            qs = []; const seen = new Set();
            let guard = 0;
            while (qs.length < n && guard++ < 500) {
                const [a, b] = cat.make(mode);
                const key = a + 'x' + b;
                if (seen.has(key)) continue;
                seen.add(key); qs.push({ a, b, ans: a * b, given: null, ok: false });
            }
            idx = 0; score = 0; streak = 0; secs = 0;
            $('modeName').textContent = mode.label;
            $('qTotal').textContent = qs.length;
            clearInterval(timerId);
            $('timer').textContent = 0;
            timerId = setInterval(() => { secs++; $('timer').textContent = secs; }, 1000);
            show('game');
            showQuestion();
        }

        function showQuestion() {
            const q = qs[idx]; answered = false;
            $('question').innerHTML = `${q.a}<span class="x">×</span>${q.b}`;
            $('answer').value = ''; $('answer').disabled = false;
            $('feedback').innerHTML = '';
            $('mainBtn').textContent = 'Check ✔';
            $('qNo').textContent = idx + 1;
            $('score').textContent = score;
            $('streak').textContent = streak;
            $('bar').style.width = (idx / qs.length * 100) + '%';
            setTimeout(() => $('answer').focus(), 50);
        }

        function check() {
            if (answered) { next(); return; }
            const v = $('answer').value.trim();
            if (v === '') { $('answer').classList.add('shake'); setTimeout(() => $('answer').classList.remove('shake'), 400); return; }
            const q = qs[idx]; q.given = +v; answered = true;
            $('answer').disabled = true;
            if (q.given === q.ans) {
                q.ok = true; score++; streak++;
                const praise = ['Super! 🌟', 'Correct! ✅', 'Wow! 🎉', 'Brilliant! 💡', 'Yes! 👏'][rnd(0, 4)];
                $('feedback').innerHTML = `<div class="good pop">${praise}</div>` + (streak >= 3 ? `<div>🔥 ${streak} in a row!</div>` : '');
            } else {
                streak = 0;
                $('feedback').innerHTML = `<div class="bad shake">Oops! ❌</div><div>${q.a} × ${q.b} = <b>${q.ans}</b></div>`;
            }
            $('score').textContent = score; $('streak').textContent = streak;
            $('bar').style.width = ((idx + 1) / qs.length * 100) + '%';
            $('mainBtn').textContent = idx === qs.length - 1 ? 'Finish 🏁' : 'Next →';
        }

        function next() {
            idx++;
            if (idx >= qs.length) finish(); else showQuestion();
        }

        function quit() {
            clearInterval(timerId);
            show('sub');
        }

        function finish() {
            clearInterval(timerId);
            const total = qs.length, pct = score / total;
            $('rScore').textContent = score; $('rTotal').textContent = total;
            const st = pct >= .9 ? 3 : pct >= .6 ? 2 : pct >= .3 ? 1 : 0;
            $('rStars').textContent = '⭐'.repeat(st) + '☆'.repeat(3 - st);
            $('rMsg').textContent = pct === 1 ? 'Perfect! You are a maths wizard! 🧙' :
                pct >= .8 ? 'Excellent work! 🎉' :
                    pct >= .5 ? 'Good job, keep going! 💪' : 'Keep practising, you will get it! 🌱';
            // save best (by score%, then time)
            const d = load(), m = d[currentMode.id] || { plays: 0, best: null, bestTime: null };
            m.plays++;
            let note = `Time: ${secs}s`;
            if (m.best === null || score > m.best || (score === m.best && secs < m.bestTime)) {
                const was = m.best; m.best = score; m.bestTime = secs;
                if (was !== null) note += ' · 🏆 New best!';
            } else note += ` · Best: ${m.best}/${total}`;
            d[currentMode.id] = m; save(d);
            $('rBest').textContent = note;
            $('rReview').innerHTML = qs.map(q =>
                `<div class="${q.ok ? 'ok' : 'no'}">${q.ok ? '✔' : '✘'} ${q.a} × ${q.b} = ${q.ans}${q.ok ? '' : ` <span style="color:var(--pencil)">(you: ${q.given})</span>`}</div>`
            ).join('');
            show('result');
        }

        /* ===================== EVENTS ===================== */
        $('mainBtn').addEventListener('click', check);
        $('answer').addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
        $('answer').addEventListener('input', e => { e.target.value = e.target.value.replace(/[^0-9]/g, ''); });
        document.addEventListener('keydown', e => { // Enter on "Next" even when input disabled
            if (e.key === 'Enter' && answered && $('game').classList.contains('active')) check();
        });
        updateTotals();
    </script>
</body>

</html>
